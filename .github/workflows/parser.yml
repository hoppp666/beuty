name: Auto Post to VK

on:
  # Запуск по расписанию (каждые 3 часа)
  schedule:
    - cron: '0 */3 * * *'
  
  # Возможность запустить воркфлоу вручную со вкладки Actions на GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем репозиторий с кодом
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Устанавливаем зависимости из requirements.txt
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Запускаем парсер, передавая секреты из настроек репозитория
      - name: Run parser and post to VK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: |
          source venv/bin/activate
          python parser.py

      # 5. Сохраняем обновленный файл posted.json обратно в репозиторий
      - name: Commit and push posted history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch posted.json
          git add posted.json
          git commit -m "Update posted.json history" || exit 0
          git push

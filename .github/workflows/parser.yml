name: VK Beauty Autopost

on:
  # Запуск каждый час
  schedule:
    - cron: '0 * * * *'
  
  # Кнопка для ручного запуска в вкладке Actions
  workflow_dispatch:

jobs:
  run-parser:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Нужно для сохранения posted.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run parser script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: |
          python parser.py

      - name: Commit and push updated history (posted.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted.json history [skip ci]" && git push)

name: VK Beauty Autopost (Gemini)

on:
  # Запуск каждые 6 часов (оптимально для отложки ВК)
  schedule:
    - cron: '0 */6 * * *'
  
  # Кнопка для ручного запуска во вкладке Actions на GitHub
  workflow_dispatch:

jobs:
  run-parser:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Требуется для автоматического сохранения posted.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser trafilatura

      - name: Run parser script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: |
          python parser.py

      - name: Commit and push updated history (posted.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted.json history [skip ci]" && git push)
